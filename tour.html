<!DOCTYPE html>
<html>
<head>
    <title>수원360투어</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />

    <!-- 카카오 SDK 불러오기 -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <script>
    // 현재 접속된 정확한 VR 투어 전체 URL 구하기 함수
    function getExactTourUrl() {
        var urlParams = new URLSearchParams(window.location.search);
        var xmlFile = urlParams.get('xml') || 'tour.xml';
        
        // 도메인 + 경로 + ?xml=파일명 형태로 주소 완전 재조합
        var baseUrl = window.location.origin + window.location.pathname;
        return baseUrl + '?xml=' + encodeURIComponent(xmlFile);
    }

    // 1. 클립보드 URL 복사 함수
    function krpanoCopyUrl() {
        var currentUrl = getExactTourUrl();

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(currentUrl).catch(function(err) {
                fallbackCopyTextToClipboard(currentUrl);
            });
        } else {
            fallbackCopyTextToClipboard(currentUrl);
        }
    }

    function fallbackCopyTextToClipboard(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.width = "2em";
        textArea.style.height = "2em";
        textArea.style.padding = "0";
        textArea.style.border = "none";
        textArea.style.outline = "none";
        textArea.style.boxShadow = "none";
        textArea.style.background = "transparent";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if (!successful) {
                prompt("아래 주소를 복사하세요:", text);
            }
        } catch (err) {
            prompt("아래 주소를 복사하세요:", text);
        }

        document.body.removeChild(textArea);
    }

    // 2. 카카오톡 공유 함수
    function krpanoShareKakao() {
        // 정확한 URL 조합해서 가져오기
        var currentUrl = getExactTourUrl();

        if (typeof Kakao !== 'undefined') {
            if (!Kakao.isInitialized()) {
                Kakao.init('b7e3aba75c04fb23f7e67e8353f74f8f');
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: '수원 360 VR 투어',
                    description: '수원의 360도 VR투어를 확인해보세요!',
                    // 카카오 규격상 이미지 주소가 필수라 1x1 투명 이미지를 대입합니다.
                    imageUrl: 'https://k.kakaocdn.net/14/dn/btqC1T5fW3S/5v11Kk406f3W68k820K7k0/o.jpg',
                    link: {
                        mobileWebUrl: currentUrl,
                        webUrl: currentUrl,
                    },
                },
                buttons: [
                    {
                        title: 'VR 투어 보러가기',
                        link: {
                            mobileWebUrl: currentUrl,
                            webUrl: currentUrl,
                        },
                    },
                ],
            });
        } else if (navigator.share) {
            navigator.share({
                title: document.title,
                url: currentUrl
            }).catch(function(e) { console.log(e); });
        } else {
            alert('카카오톡 공유를 사용할 수 없습니다.');
        }
    }
    </script>

    <style>
        html { height:100%; }
        body { height:100%; overflow:hidden; margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; font-size:16px; color:#FFFFFF; background-color:#000000; }
    </style>
</head>
<body>

<script src="tour.js"></script>

<div id="pano" style="width:100%;height:100%;">
    <noscript>
        <table style="width:100%;height:100%;">
            <tr style="vertical-align:middle;">
                <td><div style="text-align:center;">ERROR:<br/><br/>Javascript not activated<br/><br/></div></td>
            </tr>
        </table>
    </noscript>
    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var xmlFile = urlParams.get('xml');

        if (!xmlFile) {
            xmlFile = "tour.xml";
        }

        embedpano({
            xml: xmlFile, 
            target: "pano", 
            passQueryParameters: "startscene,startlookat"
        });
    </script>
</div>
<script src="app.js"></script>
</body>
