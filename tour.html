function krpanoCopyUrl() {
    var currentUrl = window.location.href;

    // 1. 최신 navigator.clipboard 방식 시도 (HTTPS 환경)
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentUrl).catch(function(err) {
            fallbackCopyTextToClipboard(currentUrl);
        });
    } else {
        // 2. HTTP 환경 또는 구형 브라우저용 예외 처리 (Fallback)
        fallbackCopyTextToClipboard(currentUrl);
    }
}

// 텍스트상자를 이용한 전통적인 복사 방식 (HTTP / 모바일 호환용)
function fallbackCopyTextToClipboard(text) {
    var textArea = document.createElement("textarea");
    textArea.value = text;
    
    // 화면 바깥에 숨기기
    textArea.style.position = "fixed";
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.width = "2em";
    textArea.style.height = "2em";
    textArea.style.padding = "0";
    textArea.style.border = "none";
    textArea.style.outline = "none";
    textArea.style.boxShadow = "none";
    textArea.style.background = "transparent";

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        var successful = document.execCommand('copy');
        if (!successful) {
            prompt("아래 주소를 복사하세요:", text);
        }
    } catch (err) {
        prompt("아래 주소를 복사하세요:", text);
    }

    document.body.removeChild(textArea);
}
function krpanoShareKakao() {
    // 1. Kakao 객체 존재 및 초기화 여부 확인
    if (typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
            // 아직 초기화가 안 되었다면 키 등록 (본인 JavaScript 키 입력)
            Kakao.init('YOUR_JAVASCRIPT_KEY'); 
        }

        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: document.title || 'VR 투어',
                description: 'VR 투어를 확인해보세요!',
                imageUrl: window.location.origin + '/preview.jpg', // 미리보기 이미지
                link: {
                    mobileWebUrl: window.location.href,
                    webUrl: window.location.href,
                },
            },
        });
    } 
    // 2. Kakao SDK가 없을 경우 모바일 기본 공유(Web Share API) 시도
    else if (navigator.share) {
        navigator.share({
            title: document.title,
            url: window.location.href
        }).catch(function(e) { console.log(e); });
    } 
    else {
        alert('카카오톡 공유를 사용할 수 없는 환경입니다.');
    }
}
</script>
