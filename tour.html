<!DOCTYPE html>
<html>
<head>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script>
  Kakao.init('b7e3aba75c04fb23f7e67e8353f74f8f'); 
function krpanoCopyUrl() {
    var currentUrl = window.location.href;

    // 1. 최신 navigator.clipboard 방식 시도 (HTTPS 환경)
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentUrl).catch(function(err) {
            fallbackCopyTextToClipboard(currentUrl);
        });
    } else {
        // 2. HTTP 환경 또는 구형 브라우저용 예외 처리 (Fallback)
        fallbackCopyTextToClipboard(currentUrl);
    }
}

// 텍스트상자를 이용한 전통적인 복사 방식 (HTTP / 모바일 호환용)
function fallbackCopyTextToClipboard(text) {
    var textArea = document.createElement("textarea");
    textArea.value = text;
    
    // 화면 바깥에 숨기기
    textArea.style.position = "fixed";
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.width = "2em";
    textArea.style.height = "2em";
    textArea.style.padding = "0";
    textArea.style.border = "none";
    textArea.style.outline = "none";
    textArea.style.boxShadow = "none";
    textArea.style.background = "transparent";

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        var successful = document.execCommand('copy');
        if (!successful) {
            prompt("아래 주소를 복사하세요:", text);
        }
    } catch (err) {
        prompt("아래 주소를 복사하세요:", text);
    }

    document.body.removeChild(textArea);
}
function krpanoShareKakao() {
    if (typeof Kakao !== 'undefined') {
        if (!Kakao.isInitialized()) {
            Kakao.init('b7e3aba75c04fb23f7e67e8353f74f8f'); 
        }

        var currentUrl = window.location.href;

        Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
                title: document.title || 'VR 투어',
                description: '수원의 360도 VR 투어를 확인해보세요!',
                // 미리보기 이미지는 반드시 외부에서 접근 가능한 전체 URL(https://...)이어야 합니다.
                imageUrl: 'https://cdn.pixabay.com/photo/2016/11/29/04/17/bonfire-1867275_1280.jpg', 
                link: {
                    mobileWebUrl: currentUrl,
                    webUrl: currentUrl,
                },
            },
            buttons: [
                {
                    title: 'VR 투어 보러가기',
                    link: {
                        mobileWebUrl: currentUrl,
                        webUrl: currentUrl,
                    },
                },
            ],
        });
    } else if (navigator.share) {
        navigator.share({
            title: document.title,
            url: window.location.href
        }).catch(function(e) { console.log(e); });
    } else {
        alert('카카오톡 공유를 사용할 수 없습니다.');
    }
}
</script>

	<title>수원360투어</title>

<body>

<div id="pano" style="width:100%;height:100%;">

<script>
    // 1. URL 파라미터에서 xml 값 가져오기 (?xml=yharbor.xml)
    var urlParams = new URLSearchParams(window.location.search);
    var xmlFile = urlParams.get('xml');

    // 2. 만약 ?xml= 파라미터가 없으면 기본값으로 "tour.xml" 사용
    if (!xmlFile) {
        xmlFile = "tour.xml";
    }

    // 3. 동적으로 구한 xmlFile 파라미터를 embedpano에 전달
    embedpano({
        xml: xmlFile, 
        target: "pano", 
        passQueryParameters: "startscene,startlookat"
    });
</script></div>
<script src="app.js"></script>
</body>
