<!DOCTYPE html>
<!--
    수원360투어 viewer.html 
    - 종료 버튼 ID: close-btn
    - 종료 함수: closeTour(event)
    - iframe 종료는 postMessage, 외부 직접 접속은 기존 종료 방식 적용
-->

<html>
<head>
    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var contents = (params.get("contents") || "suwon_tour").trim();

        if (!/^[a-zA-Z0-9_-]+$/.test(contents)) {
            contents = "suwon_tour";
        }

        var base = document.createElement("base");
        base.href = contents + "/";
        document.head.appendChild(base);
    })();
    </script>
    <title>수원360투어</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />

    <!-- 카카오 SDK 불러오기 -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <script>
    // krpano 객체를 전역에서 접근할 수 있도록 선언
    var krpanoObj = null;

    // URL 파라미터에 따라 불러올 XML 파일 결정
    function getTourInfo() {
        var urlParams = new URLSearchParams(window.location.search);
        var contentsName = (urlParams.get('contents') || 'suwon_tour').trim();
        var tourName = (urlParams.get('tour') || '').trim();
        var xmlParam = (urlParams.get('xml') || '').trim();

        if (!/^[a-zA-Z0-9_-]+$/.test(contentsName)) {
            contentsName = 'suwon_tour';
        }

        if (tourName) {
            if (!/^[a-zA-Z0-9_-]+$/.test(tourName)) {
                tourName = 'namsuheon';
            }

            return {
                contentsName: contentsName,
                tourName: tourName,
                scriptFile: 'tour.js',
                xmlFile: tourName + '.xml',
                query: 'contents=' + encodeURIComponent(contentsName)
                     + '&tour=' + encodeURIComponent(tourName)
            };
        }

        if (xmlParam) {
            var safeXml = xmlParam.replace(/\\/g, '/').split('/').pop();

            if (!/^[a-zA-Z0-9_-]+\.xml$/i.test(safeXml)) {
                safeXml = 'namsuheon.xml';
            }

            tourName = safeXml.replace(/\.xml$/i, '');

            return {
                contentsName: contentsName,
                tourName: tourName,
                scriptFile: 'tour.js',
                xmlFile: safeXml,
                query: 'contents=' + encodeURIComponent(contentsName)
                     + '&tour=' + encodeURIComponent(tourName)
            };
        }

        return {
            contentsName: 'suwon_tour',
            tourName: 'namsuheon',
            scriptFile: 'tour.js',
            xmlFile: 'namsuheon.xml',
            query: 'contents=suwon_tour&tour=namsuheon'
        };
    }

    // 현재 투어의 정확한 공유 URL 생성
    function getExactTourUrl() {
        var tourInfo = getTourInfo();
        var baseUrl = window.location.origin + window.location.pathname;
        return baseUrl + '?' + tourInfo.query;
    }

    // 1. 클립보드 URL 복사 함수
    function krpanoCopyUrl() {
        var currentUrl = getExactTourUrl();

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(currentUrl).catch(function(err) {
                fallbackCopyTextToClipboard(currentUrl);
            });
        } else {
            fallbackCopyTextToClipboard(currentUrl);
        }
    }

    function fallbackCopyTextToClipboard(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.width = "2em";
        textArea.style.height = "2em";
        textArea.style.padding = "0";
        textArea.style.border = "none";
        textArea.style.outline = "none";
        textArea.style.boxShadow = "none";
        textArea.style.background = "transparent";

        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();

        try {
            var successful = document.execCommand('copy');
            if (!successful) {
                prompt("아래 주소를 복사하세요:", text);
            }
        } catch (err) {
            prompt("아래 주소를 복사하세요:", text);
        }

        document.body.removeChild(textArea);
    }

    // 2. 카카오톡 공유 함수 (본문에 현재 URL 표시)
    function krpanoShareKakao() {
        var currentUrl = getExactTourUrl();

        if (typeof Kakao !== 'undefined') {
            if (!Kakao.isInitialized()) {
                Kakao.init('b7e3aba75c04fb23f7e67e8353f74f8f');
            }

            Kakao.Share.sendDefault({
                objectType: 'text',
                text: '[수원 360 VR 투어]\n수원의 360도 VR투어를 확인해보세요!\n\n🔗 접속 주소:\n' + currentUrl,
                link: {
                    mobileWebUrl: currentUrl,
                    webUrl: currentUrl,
                },
            });
        } else if (navigator.share) {
            navigator.share({
                title: document.title,
                url: currentUrl
            }).catch(function(e) { console.log(e); });
        } else {
            alert('카카오톡 공유를 사용할 수 없습니다.');
        }
    }
    </script>

    <style>
        html { height:100%; }
        body {
            height:100%;
            overflow:hidden;
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            font-size:16px;
            color:#FFFFFF;
            background-color:#000000;
        }

        /* 우측 상단: 종료 버튼 위 / 웹사이트, 공유 버튼 아래 */
        #panoramaActionButtons {
            position:fixed;
            top:18px;
            right:18px;
            z-index:2147483000;
            display:flex;
            flex-direction:column;
            align-items:flex-end;
            gap:8px;
            pointer-events:none;
        }

        #panoramaActionButtons button {
            pointer-events:auto;
            font-family:Arial, Helvetica, sans-serif;
            -webkit-tap-highlight-color:transparent;
        }

        #close-btn {
            width:44px;
            height:44px;
            padding:0;
            border:1px solid rgba(255,255,255,0.45);
            border-radius:50%;
            background:rgba(0,0,0,0.55);
            color:#FFFFFF;
            font-size:32px;
            line-height:40px;
            text-align:center;
            cursor:pointer;
        }

        #panoramaWebsiteBtn,
        #panoramaShareBtn {
            min-width:68px;
            height:36px;
            padding:0 14px;
            border:1px solid rgba(51,65,85,0.8);
            border-radius:20px;
            background:rgba(30,41,59,0.85);
            color:#FFFFFF;
            font-size:13px;
            font-weight:bold;
            cursor:pointer;
        }

        #close-btn:hover,
        #panoramaWebsiteBtn:hover,
        #panoramaShareBtn:hover {
            background:rgba(0,0,0,0.82);
        }

        /* 공유 팝업 공통 */
        .share-overlay {
            position:fixed;
            inset:0;
            z-index:2147483100;
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            box-sizing:border-box;
            background:rgba(0,0,0,0.60);
        }

        .share-overlay.is-open { display:flex; }

        .share-dialog {
            position:relative;
            width:280px;
            min-height:260px;
            padding:20px 25px 24px;
            box-sizing:border-box;
            border:1px solid rgba(51,65,85,0.8);
            border-radius:16px;
            background:rgba(30,41,59,0.95);
            box-shadow:0 12px 40px rgba(0,0,0,0.35);
            color:#FFFFFF;
        }

        .share-dialog-title {
            margin:2px 30px 20px;
            text-align:center;
            font-size:16px;
            font-weight:bold;
        }

        .share-dialog-close {
            position:absolute;
            top:10px;
            right:10px;
            width:34px;
            height:34px;
            padding:0;
            border:0;
            background:transparent;
            color:#94A3B8;
            font-size:20px;
            cursor:pointer;
        }

        .share-option {
            display:block;
            width:230px;
            height:40px;
            margin:0 auto 10px;
            border:0;
            border-radius:8px;
            font-size:13px;
            font-weight:bold;
            cursor:pointer;
        }

        #shareCopyBtn { background:#334155; color:#FFFFFF; }
        #shareKakaoBtn { background:#FEE500; color:#3C1E1E; }
        #shareQrBtn { background:#007BFF; color:#FFFFFF; }

        .qr-dialog {
            width:240px;
            min-height:260px;
            padding:15px 20px 18px;
            background:rgba(255,255,255,0.98);
            color:#0F172A;
            text-align:center;
            cursor:pointer;
        }

        .qr-dialog .share-dialog-title {
            margin-bottom:14px;
            font-size:14px;
        }

        #shareQrImage {
            display:block;
            width:160px;
            height:160px;
            margin:0 auto 12px;
            background:#FFFFFF;
        }

        .qr-close-tip { color:#64748B; font-size:11px; }

        #shareToast {
            position:fixed;
            left:50%;
            bottom:80px;
            z-index:2147483200;
            display:none;
            transform:translateX(-50%);
            padding:10px 18px;
            border-radius:20px;
            background:rgba(0,0,0,0.85);
            color:#FFFFFF;
            font-size:13px;
            font-weight:bold;
            white-space:nowrap;
        }

        #shareToast.is-visible { display:block; }

        @media screen and (max-width:768px) {
            #panoramaActionButtons {
                top:12px;
                right:12px;
                gap:7px;
            }

            #close-btn {
                width:40px;
                height:40px;
                font-size:28px;
                line-height:36px;
            }

            #panoramaWebsiteBtn,
            #panoramaShareBtn {
                height:34px;
                padding:0 12px;
                font-size:12px;
            }
        }
    </style>
</head>
<body>

<div id="pano" style="width:100%;height:100%;">
    <noscript>
        <table style="width:100%;height:100%;">
            <tr style="vertical-align:middle;">
                <td><div style="text-align:center;">ERROR:<br/><br/>Javascript not activated<br/><br/></div></td>
            </tr>
        </table>
    </noscript>
</div>

<script>
(function () {
    var tourInfo = getTourInfo();
    var script = document.createElement("script");

    script.src = tourInfo.scriptFile;

    script.onload = function () {
        if (typeof embedpano !== "function") {
            console.error("embedpano 함수를 찾을 수 없습니다:", tourInfo.scriptFile);
            return;
        }

        embedpano({
            xml: tourInfo.xmlFile,
            target: "pano",
            passQueryParameters: "startscene,startlookat",
            onready: function (krpano) {
                krpanoObj = krpano; // krpano 객체 연결
            }
        });
    };

    script.onerror = function () {
        console.error("tour.js 로드 실패:", tourInfo.scriptFile);
    };

    document.head.appendChild(script);
})();
</script>

<!-- 우측 상단 기능 버튼 -->
<div id="panoramaActionButtons">
    <button type="button" id="close-btn" title="종료" aria-label="파노라마 종료">&times;</button>
    <button type="button" id="panoramaWebsiteBtn" title="웹사이트 바로가기" aria-label="웹사이트">🌐웹사이트</button>
    <button type="button" id="panoramaShareBtn" title="공유" aria-label="파노라마 공유">🔗공유</button>
</div>

<!-- 공유 팝업 -->
<div id="shareModal" class="share-overlay" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-dialog" onclick="event.stopPropagation();">
        <div id="shareModalTitle" class="share-dialog-title">투어 공유하기</div>
        <button type="button" id="shareModalCloseBtn" class="share-dialog-close" aria-label="공유창 닫기">✕</button>
        <button type="button" id="shareCopyBtn" class="share-option">📋 링크 복사하기</button>
        <button type="button" id="shareKakaoBtn" class="share-option">💬 카카오톡 공유</button>
        <button type="button" id="shareQrBtn" class="share-option">📱 QR코드 보기</button>
    </div>
</div>

<!-- QR코드 팝업 -->
<div id="qrModal" class="share-overlay" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
    <div class="share-dialog qr-dialog">
        <div id="qrModalTitle" class="share-dialog-title">스캔하여 접속하기</div>
        <img id="shareQrImage" alt="현재 투어 접속 QR코드" />
        <div class="qr-close-tip">터치하면 닫힙니다</div>
    </div>
</div>

<div id="shareToast" role="status" aria-live="polite">주소가 복사되었습니다!</div>


<script>
(function () {
    'use strict';

    var closeBtn = document.getElementById('close-btn');
    var websiteBtn = document.getElementById('panoramaWebsiteBtn');
    var shareBtn = document.getElementById('panoramaShareBtn');
    var shareModal = document.getElementById('shareModal');
    var qrModal = document.getElementById('qrModal');
    var shareModalCloseBtn = document.getElementById('shareModalCloseBtn');
    var shareCopyBtn = document.getElementById('shareCopyBtn');
    var shareKakaoBtn = document.getElementById('shareKakaoBtn');
    var shareQrBtn = document.getElementById('shareQrBtn');
    var shareQrImage = document.getElementById('shareQrImage');
    var shareToast = document.getElementById('shareToast');
    var toastTimer = null;

    function openModal(modal) {
        if (modal) modal.classList.add('is-open');
    }

    function closeModal(modal) {
        if (modal) modal.classList.remove('is-open');
    }

    function closeAllModals() {
        closeModal(shareModal);
        closeModal(qrModal);
    }

    function showToast(message) {
        if (!shareToast) return;
        shareToast.textContent = message || '주소가 복사되었습니다!';
        shareToast.classList.add('is-visible');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
            shareToast.classList.remove('is-visible');
        }, 2000);
    }

    function closeTour(event) {
        var closeButton = (event && event.currentTarget) || document.getElementById("close-btn");

        if (closeButton) closeButton.blur();
        if (document.activeElement === closeButton) {
            document.activeElement.blur();
        }

        if (window.parent !== window) {
            window.parent.postMessage(
                {
                    type: "SUWON_360_CLOSE",
                    source: "suwon360",
                    action: "close"
                },
                "*"
            );
            return;
        }

        if (window.history.length > 1) {
            window.history.back();
            return;
        }

        try {
            window.close();
        } catch (_) {
            window.location.href = "./";
        }

        window.setTimeout(function () {
            if (!document.hidden) window.location.href = "./";
        }, 250);
    }

    window.closeTour = closeTour;

    if (closeBtn) {
        closeBtn.addEventListener("click", closeTour);
    }

    // 웹사이트 버튼 클릭 이벤트
    if (websiteBtn) {
        websiteBtn.addEventListener('click', function () {
            if (krpanoObj) {
                var targetUrl = krpanoObj.get('website_url');
                if (targetUrl) {
                    window.open(targetUrl, '_blank');
                } else {
                    alert('등록된 웹사이트 주소가 없습니다.');
                }
            } else {
                alert('투어가 아직 완전히 로드되지 않았습니다.');
            }
        });
    }

    if (shareBtn) {
        shareBtn.addEventListener('click', function () {
            openModal(shareModal);
        });
    }

    if (shareModal) {
        shareModal.addEventListener('click', function () {
            closeModal(shareModal);
        });
    }

    if (shareModalCloseBtn) {
        shareModalCloseBtn.addEventListener('click', function () {
            closeModal(shareModal);
        });
    }

    if (shareCopyBtn) {
        shareCopyBtn.addEventListener('click', function () {
            krpanoCopyUrl();
            closeModal(shareModal);
            showToast('주소가 복사되었습니다!');
        });
    }

    if (shareKakaoBtn) {
        shareKakaoBtn.addEventListener('click', function () {
            closeModal(shareModal);
            krpanoShareKakao();
        });
    }

    if (shareQrBtn) {
        shareQrBtn.addEventListener('click', function () {
            var currentUrl = getExactTourUrl();
            shareQrImage.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(currentUrl);
            closeModal(shareModal);
            openModal(qrModal);
        });
    }

    if (qrModal) {
        qrModal.addEventListener('click', function () {
            closeModal(qrModal);
        });
    }

    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeAllModals();
    });
})();
</script>
</body>
</html>
